[ubuntuServers]
buildServer ansible_host=10.0.0.135 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

appServer ansible_host=10.0.0.10 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[jenkinsServer]
jenkinsHost ansible_host=10.0.0.15 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
