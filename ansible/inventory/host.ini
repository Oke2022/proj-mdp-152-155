[ubuntuServers]
buildServer ansible_host=10.0.0.135 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

appServer ansible_host=10.0.0.10 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[jenkinsServer]
jenkinsHost ansible_host=10.0.0.15 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[ansibleServer]
ansibleMaster ansible_host=10.0.0.140 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[k8Servers]
k8Master ansible_host=10.0.0.20 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'

k8Worker ansible_host=10.0.1.5 ansible_user=ubuntu ansible_ssh_private_key_file=/home/ubuntu/my-key1.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
~                                                                                 
